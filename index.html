
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pilotage du bateau — R1</title>
<style>
:root {
  --bg:#e9eff1; --surface:#f8fafb; --ink:#11283a; --muted:#5d7280;
  --line:#c3d0d6; --rouge:#c8372d; --vert:#1f8a5b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark) {
  :root { --bg:#0d1a24; --surface:#15293a; --ink:#e6eef2; --muted:#8fa5b3;
    --line:#2b4357; --rouge:#e5564b; --vert:#3fb987; color-scheme:dark; }
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
body {
  background:var(--bg); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
          env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
.app { height:100%; display:grid; grid-template-rows:auto 1fr auto; gap:4px; padding:8px 18px; }
.haut { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
.pastille { justify-self:start; font-size:.85rem; font-weight:600; padding:4px 12px;
  border-radius:999px; color:var(--muted); border:1px solid var(--line); }
body[data-connecte="1"] .pastille { color:var(--vert); border-color:var(--vert); }
button { font:inherit; cursor:pointer; touch-action:manipulation; }
button:disabled { cursor:default; opacity:.55; }
#urgence { font-size:.85rem; font-weight:700; letter-spacing:.04em; padding:10px 24px;
  border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
#urgence:not(:disabled) { background:var(--rouge); color:#fff; border-color:transparent; }
.version { justify-self:end; font-size:.70rem; color:var(--muted); text-align:right; }
.corps { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; min-height:0; }
.bloc { display:flex; flex-direction:column; align-items:center; gap:6px; }
.etiq { font-size:.8rem; color:var(--muted); }
.stick { position:relative; background:var(--surface); border:2px solid var(--line);
  border-radius:999px; touch-action:none; }
.stick.v { width:96px; height:clamp(110px,calc(100dvh - 155px),230px); }
.stick.h { width:clamp(140px,37vw,300px); height:96px;
  background:linear-gradient(90deg,#c8372d26 0 50%,#1f8a5b26 50% 100%),var(--surface); }
.knob { position:absolute; left:50%; top:50%; width:62px; height:62px;
  margin:-31px 0 0 -31px; border-radius:50%; background:var(--ink); pointer-events:none; }
.milieu { position:absolute; background:var(--line); pointer-events:none; }
.stick.v .milieu { left:16px; right:16px; top:50%; height:2px; }
.stick.h .milieu { top:16px; bottom:16px; left:50%; width:2px; }
.stick.off { opacity:.3; }
.stick.actif { border-color:var(--ink); }
.cotes { display:flex; justify-content:space-between; width:clamp(140px,37vw,300px); font-size:.8rem; font-weight:600; }
.cotes .b { color:var(--rouge); } .cotes .t { color:var(--vert); }
.centre { display:flex; flex-direction:column; align-items:center; text-align:center; }
.val { font-size:2rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }
.sous { font-size:.8rem; color:var(--muted); margin-bottom:8px; }
.action { display:flex; justify-content:center; align-items:center; min-height:46px; }
#act { min-width:160px; min-height:44px; font-size:.9rem; font-weight:600; padding:9px 22px;
  border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); }
.tourner { display:none; }
@media (orientation:portrait) {
  .app { display:none; }
  .tourner { display:flex; height:100%; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:var(--muted); margin:0; }
}
@media (orientation:landscape) and (max-height:300px) {
  .app { padding:4px 12px; }
  .stick.v { height:clamp(94px,calc(100dvh - 117px),160px); }
  .stick.h { height:76px; }
  .knob { width:54px; height:54px; margin:-27px 0 0 -27px; }
  .val { font-size:1.5rem; }
}
</style>
</head>
<body data-connecte="0">
<p class="tourner">Tourne ton téléphone en mode paysage pour piloter.</p>
<div class="app">
  <div class="haut">
    <span class="pastille" id="pastille" role="status">Non connecté</span>
    <button id="urgence" type="button" disabled>URGENCE</button>
    <span class="version" id="version">JavaScript non chargé</span>
  </div>
  <div class="corps">
    <div class="bloc">
      <div class="stick v off" id="gaz" aria-label="Joystick propulsion"><div class="milieu"></div><div class="knob"></div></div>
      <span class="etiq">Vitesse</span>
    </div>
    <div class="centre">
      <div class="val" id="vVit">0 %</div><div class="sous">vitesse</div>
      <div class="val" id="vBar">0°</div><div class="sous">barre</div>
    </div>
    <div class="bloc">
      <div class="stick h off" id="barre" aria-label="Joystick barre"><div class="milieu"></div><div class="knob"></div></div>
      <div class="cotes"><span class="b">Bâbord</span><span class="t">Tribord</span></div>
      <span class="etiq">Barre</span>
    </div>
  </div>
  <div class="action"><button id="act" type="button" disabled>Se connecter</button></div>
</div>
<script src="script.js"></script>
</body>
</html>
