<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pilotage du bateau</title>
<style>
:root {
  --bg:#e9eff1; --surface:#f8fafb; --ink:#11283a; --muted:#5d7280; --line:#c3d0d6;
  --rouge:#c8372d; --vert:#1f8a5b; --ambre:#a86a0c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1a24; --surface:#15293a; --ink:#e6eef2; --muted:#8fa5b3; --line:#2b4357;
          --rouge:#e5564b; --vert:#3fb987; --ambre:#e0a23c; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
body {
  background:var(--bg); color:var(--ink); --c:var(--muted);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
/* Couleur de l'état en cours */
body[data-etat="verrouille"] { --c:var(--rouge); }
body[data-etat="pret"]       { --c:var(--ambre); }
body[data-etat="marche"]     { --c:var(--vert); }
body[data-perdue="1"]        { --c:var(--rouge); }

.app { height:100%; display:grid; grid-template-rows:auto 1fr auto; gap:4px; padding:8px 18px; }

/* Haut : état | urgence | liaison */
.haut { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
.pastille {
  justify-self:start; font-size:.85rem; font-weight:600; padding:4px 12px; border-radius:999px;
  color:var(--c); background:color-mix(in srgb, var(--c) 16%, var(--surface));
  border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
}
#urgence {
  font:inherit; font-size:.85rem; font-weight:700; letter-spacing:.04em; padding:8px 24px;
  border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  touch-action:manipulation;
}
#urgence:not(:disabled) { background:var(--rouge); color:#fff; border-color:transparent; cursor:pointer; }
.lien { justify-self:end; font-size:.8rem; color:var(--muted); display:flex; gap:8px; align-items:center; }
#coupure { font:inherit; font-size:.75rem; padding:2px 8px; border-radius:6px; border:1px solid var(--line);
           background:transparent; color:var(--muted); cursor:pointer; }

/* Centre : joysticks et valeurs */
.corps { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; min-height:0; }
.bloc { display:flex; flex-direction:column; align-items:center; gap:6px; }
.etiq { font-size:.8rem; color:var(--muted); }
.stick { position:relative; background:var(--surface); border:2px solid var(--line); border-radius:999px; touch-action:none; }
.stick.v { width:96px; height:clamp(120px, calc(100dvh - 185px), 230px); }
.stick.h { width:300px; height:96px;
  background:linear-gradient(90deg,
    color-mix(in srgb, var(--rouge) 20%, var(--surface)) 0 50%,
    color-mix(in srgb, var(--vert) 20%, var(--surface)) 50% 100%); }
.knob { position:absolute; left:50%; top:50%; width:62px; height:62px; margin:-31px 0 0 -31px; border-radius:50%; background:var(--ink); }
.milieu { position:absolute; background:var(--line); }
.stick.v .milieu { left:16px; right:16px; top:50%; height:2px; }
.stick.h .milieu { top:16px; bottom:16px; left:50%; width:2px; }
.stick.off { opacity:.3; }
.stick.actif { border-color:var(--ink); }
.cotes { display:flex; justify-content:space-between; width:300px; font-size:.8rem; font-weight:600; }
.cotes .b { color:var(--rouge); } .cotes .t { color:var(--vert); }
.centre { display:flex; flex-direction:column; align-items:center; text-align:center; }
.val { font-size:2rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }
.sous { font-size:.8rem; color:var(--muted); margin-bottom:8px; }

/* Bas : bouton d'action */
.action { display:flex; justify-content:center; align-items:center; gap:10px; min-height:46px; }
#act {
  position:relative; overflow:hidden; font:inherit; font-size:.9rem; font-weight:600;
  min-width:160px; min-height:44px; padding:9px 22px; border-radius:10px;
  border:1.5px solid var(--c); background:var(--surface); color:var(--ink);
  touch-action:manipulation; cursor:pointer;
}
#act span { position:relative; }
#act .fill { position:absolute; inset:0 auto 0 0; width:0; background:color-mix(in srgb, var(--c) 30%, transparent); }
#act .fill.go { width:100%; transition:width 1s linear; }
#act.arme { background:color-mix(in srgb, var(--c) 22%, var(--surface)); }
#aide { font-size:.8rem; color:var(--muted); }

/* Portrait : consigne */
.tourner { display:none; }
@media (orientation:portrait) {
  .app { display:none; }
  .tourner { display:flex; height:100%; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); }
}
</style>
</head>
<body data-etat="deconnecte">
<p class="tourner">Tourne ton téléphone en mode paysage pour piloter.</p>

<div class="app">
  <div class="haut">
    <span class="pastille" id="pastille">Non connecté</span>
    <button id="urgence" type="button" disabled>URGENCE</button>
    <div class="lien"><span id="lienTxt"></span><button id="coupure" type="button">Couper (test)</button></div>
  </div>

  <div class="corps">
    <div class="bloc">
      <div class="stick v off" id="gaz"><div class="milieu"></div><div class="knob"></div></div>
      <span class="etiq">Vitesse</span>
    </div>

    <div class="centre">
      <div class="val" id="vVit">—</div><div class="sous">vitesse</div>
      <div class="val" id="vBar">—</div><div class="sous">barre</div>
    </div>

    <div class="bloc">
      <div class="stick h off" id="barre"><div class="milieu"></div><div class="knob"></div></div>
      <div class="cotes"><span class="b">Bâbord</span><span class="t">Tribord</span></div>
      <span class="etiq">Barre</span>
    </div>
  </div>

  <div class="action">
    <button id="act" type="button"><div class="fill"></div><span id="actTxt">Se connecter</span></button>
    <span id="aide">Un appui</span>
  </div>
</div>

<script>
// ---------- Réglages ----------
const ANGLE_MAX = 45;          // barre : -45° à +45°
const ZONE_MORTE = 0.06;       // petite zone neutre au centre des joysticks
const DUREE_MAINTIEN = 1000;   // ms pour réarmer
const FENETRE_DOUBLE = 700;    // ms entre les deux appuis d'un double clic

const ETATS = {
  deconnecte: { nom:'Non connecté', bouton:'Se connecter', aide:'Un appui',       mode:'simple'   },
  verrouille: { nom:'Verrouillé',   bouton:'Réarmer',      aide:'Maintenir 1 s',  mode:'maintien' },
  pret:       { nom:'Prêt',         bouton:'Démarrer',     aide:'Double clic',    mode:'double'   },
  marche:     { nom:'En marche',    bouton:'Arrêt',        aide:'Double clic',    mode:'double'   }
};

const $ = id => document.getElementById(id);
let etat = 'deconnecte', liaisonPerdue = false, vitesse = 0, angle = 0;

// ---------- Joystick (valeur de -1 à +1, retour au centre au relâchement) ----------
function creerStick(el, axe, onChange) {
  const knob = el.querySelector('.knob');
  let actif = false, id = null, permis = false;

  function placer(v) {
    const max = ((axe === 'y' ? el.clientHeight : el.clientWidth) - knob.offsetWidth) / 2;
    const px = (axe === 'y' ? -v : v) * max;
    knob.style.transform = axe === 'y' ? `translateY(${px}px)` : `translateX(${px}px)`;
  }
  function lire(e) {
    const r = el.getBoundingClientRect();
    const max = ((axe === 'y' ? r.height : r.width) - knob.offsetWidth) / 2;
    const d = axe === 'y' ? (r.top + r.height / 2 - e.clientY) : (e.clientX - (r.left + r.width / 2));
    const v = Math.max(-1, Math.min(1, d / max));
    placer(v);
    onChange(Math.abs(v) < ZONE_MORTE ? 0 : v);
  }
  function reset() { actif = false; el.classList.remove('actif'); placer(0); onChange(0); }

  el.addEventListener('pointerdown', e => {
    if (!permis) return;
    actif = true; id = e.pointerId; el.setPointerCapture(id); el.classList.add('actif'); lire(e);
  });
  el.addEventListener('pointermove', e => { if (actif && e.pointerId === id) lire(e); });
  el.addEventListener('pointerup', () => { if (actif) reset(); });
  el.addEventListener('pointercancel', () => { if (actif) reset(); });

  return { activer(b) { permis = b; el.classList.toggle('off', !b); if (!b) reset(); } };
}

const gaz = creerStick($('gaz'), 'y', v => { vitesse = Math.round(v * 100); afficherValeurs(); });
const barre = creerStick($('barre'), 'x', v => { angle = Math.round(v * ANGLE_MAX); afficherValeurs(); });

function afficherValeurs() {
  const off = etat === 'deconnecte';
  $('vVit').textContent = off ? '—' : (vitesse > 0 ? '+' : '') + vitesse + ' %';
  $('vBar').textContent = off ? '—' : (angle > 0 ? '+' : '') + angle + '°';
}

// ---------- Machine à états ----------
function aller(nouvelEtat) {
  etat = nouvelEtat;
  desarmer();
  render();
}

function render() {
  const e = ETATS[etat];
  document.body.dataset.etat = etat;
  document.body.dataset.perdue = (liaisonPerdue && etat === 'deconnecte') ? '1' : '0';
  $('pastille').textContent = (liaisonPerdue && etat === 'deconnecte') ? 'Liaison perdue' : e.nom;
  $('urgence').disabled = !(etat === 'pret' || etat === 'marche');
  $('lienTxt').textContent = etat === 'deconnecte' ? 'Bluetooth : démo, non connecté' : 'Connecté (démo)';
  $('coupure').style.display = etat === 'deconnecte' ? 'none' : '';
  gaz.activer(etat === 'marche');                     // vitesse : seulement en marche
  barre.activer(etat === 'pret' || etat === 'marche'); // barre : prêt et en marche
  afficherBouton();
  afficherValeurs();
}

// ---------- Urgence : un seul appui, réagit dès le contact ----------
$('urgence').addEventListener('pointerdown', () => {
  if (etat === 'pret' || etat === 'marche') aller('verrouille');
});

// ---------- Liaison simulée ----------
$('coupure').addEventListener('click', () => {
  if (etat !== 'deconnecte') { liaisonPerdue = true; aller('deconnecte'); }
});

// ---------- Bouton d'action ----------
let minuteur = null, timerArme = null, armeJusqua = 0, ignorerClic = false;
const act = $('act'), fill = act.querySelector('.fill');

function afficherBouton() {
  const e = ETATS[etat];
  const arme = Date.now() < armeJusqua;
  $('actTxt').textContent = arme ? 'Touche encore' : e.bouton;
  $('aide').textContent = e.aide;
  act.classList.toggle('arme', arme);
}
function desarmer() { clearTimeout(timerArme); armeJusqua = 0; afficherBouton(); }
function annulerMaintien() { clearTimeout(minuteur); minuteur = null; fill.classList.remove('go'); }

// Maintien (réarmer) : jauge qui se remplit pendant 1 s
act.addEventListener('pointerdown', () => {
  ignorerClic = false;
  if (ETATS[etat].mode !== 'maintien') return;
  fill.classList.add('go');
  minuteur = setTimeout(() => {
    annulerMaintien();
    ignorerClic = true;      // le relâchement ne doit pas compter comme un premier clic
    aller('pret');
  }, DUREE_MAINTIEN);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => act.addEventListener(t, annulerMaintien));

// Appui simple (connexion) et double clic (démarrer / arrêter)
act.addEventListener('click', () => {
  if (ignorerClic) { ignorerClic = false; return; }
  const mode = ETATS[etat].mode;
  if (mode === 'simple') {
    liaisonPerdue = false;
    aller('verrouille');                     // toute connexion démarre verrouillée
  } else if (mode === 'double') {
    if (Date.now() < armeJusqua) {           // second appui dans la fenêtre : on valide
      aller(etat === 'pret' ? 'marche' : 'pret');
    } else {                                 // premier appui : on arme et on le montre
      armeJusqua = Date.now() + FENETRE_DOUBLE;
      afficherBouton();
      timerArme = setTimeout(desarmer, FENETRE_DOUBLE);
    }
  }
});

render();
</script>
</body>
</html>
